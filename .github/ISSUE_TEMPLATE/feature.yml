name: Implementation / improvement
description: Register a scoped task with evidence, risk and acceptance criteria
title: "[TASK] "
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Goal and background
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence, affected components and risk
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and executable tests
    validations:
      required: true
